# Manual: reproduce Microsoft Graph error codes against the lab tenant and record what Graph
# returns. Auth via GitHub OIDC federated credential (no secrets). Objects created for the run
# are deleted at the end of it.
name: Lab Graph errors
on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 3 * *'

permissions:
  id-token: write
  contents: read
  issues: write

concurrency: lab-graph-errors

jobs:
  run:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      # Identifiers of the lab tenant and its apps, not secrets.
      LAB_TENANT_ID: 905b9584-9c20-43bd-991e-e910a3f1dbfa
      LAB_DOMAIN: brambrambrinkmeier.onmicrosoft.com
      LAB_RUNNER_CLIENT_ID: dc923687-81e4-4216-8f93-debdd99c2607
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reproduce Graph error codes
        run: node scripts/lab/graph-errors.mjs
      - name: Keep the results
        uses: actions/upload-artifact@v4
        with:
          name: graph-errors
          path: graph-errors.json
      - name: Open an issue with the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create lab-run --color 5319E7 --description "Lab tenant reproduction results" --force
          gh issue create --label lab-run --title "Lab run $(date +%Y-%m-%d): Graph error codes" --body-file graph-errors.md
